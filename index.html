<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toy Drone</title>
  </head>
  <body>
    <main class="app">
      <header class="hud-bar">
        <p id="status" class="status" aria-live="polite">Tap a cell to place your drone</p>
        <div class="hud-tools">
          <button
            type="button"
            id="view-toggle"
            class="tool-button"
            aria-pressed="true"
            aria-label="3D view"
            title="Switch between 3D and top view"
          >
            3D
          </button>
          <button
            type="button"
            id="coords-toggle"
            class="tool-button"
            aria-pressed="false"
            aria-label="Show coordinates"
            title="Show coordinates"
          >
            0,0
          </button>
          <button
            type="button"
            id="console-toggle"
            class="tool-button console-toggle"
            aria-expanded="false"
            aria-controls="console"
            aria-label="Command console"
            title="Command console"
          >
            &gt;_
          </button>
        </div>
      </header>

      <section id="board-area" class="board-area" aria-label="Drone surface">
        <div id="board-frame" class="board-frame">
          <div id="board" class="board"></div>
          <div id="board-layer" class="board-layer"></div>
        </div>
      </section>

      <section id="controls" class="controls-area" aria-label="Controls">
        <div id="facing-picker" class="facing-picker" hidden>
          <p class="facing-title">
            <span class="facing-words">Place on </span><strong id="facing-target"></strong
            ><span class="facing-words"> facing</span>
          </p>
          <div class="facing-buttons">
            <button type="button" class="pad-button" data-facing="NORTH" aria-label="North">N</button>
            <button type="button" class="pad-button" data-facing="EAST" aria-label="East">E</button>
            <button type="button" class="pad-button" data-facing="SOUTH" aria-label="South">S</button>
            <button type="button" class="pad-button" data-facing="WEST" aria-label="West">W</button>
            <button type="button" class="pad-button" data-cancel aria-label="Cancel">&#10005;</button>
          </div>
        </div>

        <div id="pad" class="pad">
          <button type="button" class="pad-button" data-command="LEFT" aria-label="Turn left">
            <span aria-hidden="true">&#8634;</span>
          </button>
          <button type="button" class="pad-button" data-command="MOVE" aria-label="Move forward">
            <span aria-hidden="true">&#9650;</span>
          </button>
          <button type="button" class="pad-button" data-command="RIGHT" aria-label="Turn right">
            <span aria-hidden="true">&#8635;</span>
          </button>
          <button type="button" class="pad-button pad-button-wide" data-command="ATTACK">Attack</button>
          <button type="button" class="pad-button pad-button-wide" data-command="REPORT">Report</button>
        </div>

        <form id="console" class="console">
          <label class="console-label" for="console-input">Commands</label>
          <textarea
            id="console-input"
            class="console-input"
            rows="2"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="PLACE 1,2,EAST"
          ></textarea>
          <button type="submit" class="pad-button console-run">Run</button>
          <p id="console-output" class="console-output" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
